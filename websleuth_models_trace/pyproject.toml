[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websleuth-models"
version = "0.2.0"
description = "Proof-carrying web continual learning with append-only neural knowledge cells"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Websleuth Models contributors"}]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "networkx>=3.3",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "Pillow>=10.3",
  "PyMuPDF>=1.24",
  "pypdf>=4.2",
  "reportlab>=4.2",
  "safetensors>=0.4",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[project.optional-dependencies]
models = [
  "transformers>=4.46",
  "datasets>=3.1",
  "accelerate>=1.1",
  "sentencepiece>=0.2",
  "tokenizers>=0.20",
]
browser = ["playwright>=1.48"]
media = [
  "opencv-python-headless>=4.10",
  "imageio-ffmpeg>=0.5",
  "pytesseract>=0.3.13",
  "faster-whisper>=1.0",
]
eval = [
  "lm-eval>=0.4.7",
  "evaluate>=0.4.3",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = [
  "transformers>=4.46",
  "datasets>=3.1",
  "accelerate>=1.1",
  "sentencepiece>=0.2",
  "tokenizers>=0.20",
  "playwright>=1.48",
  "opencv-python-headless>=4.10",
  "imageio-ffmpeg>=0.5",
  "pytesseract>=0.3.13",
  "faster-whisper>=1.0",
  "lm-eval>=0.4.7",
  "evaluate>=0.4.3",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
websleuth = "wm.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
