name: Atlas proof check

on:
  push:
    branches: ["atlas-proof-check-temp"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and restore Mathlib cache
        working-directory: atlas-check
        shell: bash
        run: |
          lake update
          lake exe cache get
      - name: Kernel build
        working-directory: atlas-check
        shell: bash
        run: |
          set +e
          lake build AtlasCheck > kernel-build.log 2>&1
          status=$?
          cat kernel-build.log
          exit $status
      - name: Upload kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kernel-log
          path: atlas-check/kernel-build.log
          if-no-files-found: warn
