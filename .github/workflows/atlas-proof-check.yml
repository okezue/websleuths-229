name: Atlas proof check

on:
  push:
    branches: ["atlas-proof-check-temp"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: atlas-check
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          nanoda: false
      - name: Kernel build
        working-directory: atlas-check
        shell: bash
        run: |
          set +e
          lake build > kernel-build.log 2>&1
          status=$?
          cat kernel-build.log
          exit $status
      - name: Upload kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kernel-log
          path: atlas-check/kernel-build.log
          if-no-files-found: error
