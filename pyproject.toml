[build-system]
requires=["setuptools>=68.0","wheel"]
build-backend="setuptools.build_meta"

[project]
name="websleuths-wm"
version="0.1.0"
requires-python=">=3.10"
dependencies=[
  "pydantic>=2.0",
  "tiktoken>=0.5",
  "torch>=2.0",
  "transformers>=4.36",
  "peft>=0.7",
  "datasets>=2.14",
  "accelerate>=0.25",
  "requests>=2.28",
]

[project.optional-dependencies]
dev=[
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.21",
]
exa=["exa-py>=1.0"]
neuron=["optimum-neuron>=0.0.20"]

ranking=[
    "scrapy>=2.10.0",
    "crochet>=2.0.0",
    "twisted>=25.5.0",
    "pydispatch>=1.1.0",
    "networkx>=3.5"
]

[tool.setuptools.packages.find]
include=["wm*"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-v --tb=short"
